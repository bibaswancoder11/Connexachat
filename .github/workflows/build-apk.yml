name: Build Android APK (Connexa)

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'App Version Name (e.g. 1.0.0)'
        required: true
        default: '1.0.0'
      version_code:
        description: 'App Version Code (integer, e.g. 1)'
        required: true
        default: '1'
      build_type:
        description: 'Build Type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set Up Java 21 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Web & Capacitor Dependencies
        run: |
          npm install

      - name: Build Web Application (Vite)
        run: |
          npm run build

      - name: Initialize & Sync Capacitor Android
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Generate Native Connexa App Icons & Assets
        run: |
          npm run generate:icons

      - name: Configure App Version, Name, Manifest & Native Share Bridge
        run: |
          VERSION_NAME="${{ github.event.inputs.version_name || '1.0.0' }}"
          VERSION_CODE="${{ github.event.inputs.version_code || '1' }}"
          echo "Building Connexa version: $VERSION_NAME (Code: $VERSION_CODE)"

          STRINGS_PATH="android/app/src/main/res/values/strings.xml"
          if [ -f "$STRINGS_PATH" ]; then
            sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">Connexa<\/string>/g' "$STRINGS_PATH" || true
            sed -i 's/<string name="title_activity_main">.*<\/string>/<string name="title_activity_main">Connexa<\/string>/g' "$STRINGS_PATH" || true
          fi

          if [ -f "android/app/build.gradle" ]; then
            sed -i "s/versionCode 1/versionCode $VERSION_CODE/g" android/app/build.gradle || true
            sed -i "s/versionName \"1.0\"/versionName \"$VERSION_NAME\"/g" android/app/build.gradle || true
          fi

          # Apply google-services.json, AndroidManifest permissions, FileProvider safety, and MainActivity bridge
          npm run configure:android

          # Verify FileProvider is NOT exported (prevents fatal SecurityException on launch)
          if grep -A 5 "androidx.core.content.FileProvider" android/app/src/main/AndroidManifest.xml | grep -q 'android:exported="true"'; then
            echo "FATAL: FileProvider must never have android:exported=true!"
            exit 1
          fi
          echo "Verified AndroidManifest.xml FileProvider security configuration."

      - name: Grant Execute Permission for Gradle
        run: |
          cd android
          chmod +x gradlew

      - name: Build & Sign Android APK (${{ github.event.inputs.build_type || 'debug' }})
        run: |
          cd android
          BUILD_TYPE="${{ github.event.inputs.build_type || 'debug' }}"
          if [ "$BUILD_TYPE" = "release" ]; then
            ./gradlew assembleRelease
            UNSIGNED_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
            SIGNED_APK="app/build/outputs/apk/release/app-release.apk"
            if [ -f "$UNSIGNED_APK" ]; then
              KEYSTORE_PATH="/tmp/connexa-release.keystore"
              keytool -genkeypair -v \
                -keystore "$KEYSTORE_PATH" \
                -alias connexa \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -storepass connexa123 \
                -keypass connexa123 \
                -dname "CN=Connexa Messenger, OU=Mobile, O=Connexa, L=City, S=State, C=US"
              BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
              "$BUILD_TOOLS_DIR/zipalign" -v -p 4 "$UNSIGNED_APK" "/tmp/app-release-aligned.apk"
              "$BUILD_TOOLS_DIR/apksigner" sign \
                --ks "$KEYSTORE_PATH" \
                --ks-key-alias connexa \
                --ks-pass pass:connexa123 \
                --key-pass pass:connexa123 \
                --out "$SIGNED_APK" \
                "/tmp/app-release-aligned.apk"
              "$BUILD_TOOLS_DIR/apksigner" verify "$SIGNED_APK"
            fi
          else
            ./gradlew assembleDebug
          fi

      - name: Organize & Rename Output APK
        id: organize_apk
        run: |
          VERSION_NAME="${{ github.event.inputs.version_name || '1.0.0' }}"
          BUILD_TYPE="${{ github.event.inputs.build_type || 'debug' }}"

          mkdir -p output_apk

          if [ "$BUILD_TYPE" = "release" ] && [ -f "android/app/build/outputs/apk/release/app-release.apk" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk output_apk/Connexa-v${VERSION_NAME}-release.apk
            echo "apk_path=output_apk/Connexa-v${VERSION_NAME}-release.apk" >> $GITHUB_OUTPUT
            echo "apk_name=Connexa-v${VERSION_NAME}-release.apk" >> $GITHUB_OUTPUT
          elif [ -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk output_apk/Connexa-v${VERSION_NAME}-debug.apk
            echo "apk_path=output_apk/Connexa-v${VERSION_NAME}-debug.apk" >> $GITHUB_OUTPUT
            echo "apk_name=Connexa-v${VERSION_NAME}-debug.apk" >> $GITHUB_OUTPUT
          else
            FOUND_APK=$(find android/app/build/outputs/apk -name "*.apk" ! -name "*-unsigned.apk" | head -n 1)
            if [ -n "$FOUND_APK" ]; then
              cp "$FOUND_APK" output_apk/Connexa-v${VERSION_NAME}.apk
              echo "apk_path=output_apk/Connexa-v${VERSION_NAME}.apk" >> $GITHUB_OUTPUT
              echo "apk_name=Connexa-v${VERSION_NAME}.apk" >> $GITHUB_OUTPUT
            else
              echo "Error: No installable signed APK file was generated."
              exit 1
            fi
          fi

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Connexa-v${{ github.event.inputs.version_name || '1.0.0' }}-APK
          path: output_apk/
          retention-days: 90

      - name: Create GitHub Release with APK (for tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: output_apk/*.apk
          name: Connexa Release ${{ github.ref_name }}
          body: |
            ## Connexa Messenger - Android APK Release 🎉
            
            - **Version**: `${{ github.ref_name }}`
            - **Build Date**: `${{ github.event.head_commit.timestamp || 'Latest' }}`
            - Download the attached APK below to install on your Android device.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
